
name: Guardian AI CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "fastapi[standard]" pytest httpx sqlalchemy psycopg2-binary "python-jose[cryptography]" "pwdlib[argon2]" python-dotenv

      - name: Run backend tests
        run: |
          python -m pytest backend/tests -v
