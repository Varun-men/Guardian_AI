
name: Guardian AI CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "fastapi[standard]" pytest httpx sqlalchemy psycopg2-binary "python-jose[cryptography]" "pwdlib[argon2]" python-dotenv

      - name: Run backend tests
        env:
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
        run: |
          python -m pytest backend/tests -v
            - name: Verify JWT configuration
        env:
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
        run: |
          if [ -z "$JWT_SECRET_KEY" ]; then
            echo "JWT_SECRET_KEY is missing"
            exit 1
          else
            echo "JWT_SECRET_KEY is configured"
          fi